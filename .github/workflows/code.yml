name: Unit Tests

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/*'
      - '**/*.html'
      - '**/*.md'
      - '**/*.rst'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
      - 'README.md'
      - 'RELEASE_NOTES.rst'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/*'
      - '**/*.html'
      - '**/*.md'
      - '**/*.rst'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
      - 'README.md'
      - 'RELEASE_NOTES.rst'
  workflow_dispatch: # allow manual triggering
  schedule:
    - cron: "03 04 * * 1" # Monday at 4:03AM

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash -l {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: py313
          activate-environment: true
          cache: true
          locked: true

      - name: Run pre-commit
        run: pixi run --locked -e py313 lint

  tests:
    name: Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pixi-environment: py311
          - python-version: "3.12"
            pixi-environment: py312
          - python-version: "3.13"
            pixi-environment: py313
          - python-version: "3.14"
            pixi-environment: py314
          - python-version: "3.15"
            pixi-environment: py315
          # Re-enable Python 3.16-dev when conda-forge provides it.
          # - python-version: "3.16-dev"
          #   pixi-environment: py316-dev
          #   experimental: true
      max-parallel: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: ${{ matrix.pixi-environment }}
          activate-environment: true
          cache: true
          locked: true

      - name: Diagnostic
        run: |
          set -euo pipefail
          pixi info
          pixi list -e "${{ matrix.pixi-environment }}"
          python --version
          python -c "import coverage, epics, hklpy2; solver = hklpy2.get_solver('hkl_soleil'); print('coverage:', coverage.__version__); print('epics:', epics.__file__); print('hklpy2:', hklpy2.__file__); print('hkl_soleil:', solver)"
          command -v caget cainfo softIoc caRepeater

      - name: Start EPICS softIoc
        run: |
          set -euo pipefail
          caRepeater &
          softIoc \
            -S \
            -m "P=hklpy2:" \
            -d ./src/hklpy2/tests/testing.db \
            -x "hklpy2" \
            ./src/hklpy2/tests/st.cmd &
          echo "Waiting for EPICS IOC to start..."
          sleep 15
          echo "EPICS IOC should be running now."

      - name: Check on the EPICS IOC
        run: |
          set -euo pipefail
          echo "info hklpy2:wavelength = $(cainfo hklpy2:wavelength)"
          caget hklpy2:BaseVersion hklpy2:{energy,wavelength}.{NAME,VAL,EGU,DESC}

      - name: Run tests with pytest & coverage
        run: |
          set -vxeuo pipefail
          mkdir -p reports

          # Run pixi tasks for testing and coverage
          pixi run --locked -e "${{ matrix.pixi-environment }}" test
          pixi run --locked -e "${{ matrix.pixi-environment }}" coverage-combine
          pixi run --locked -e "${{ matrix.pixi-environment }}" coverage-report
          pixi run --locked -e "${{ matrix.pixi-environment }}" coverage-xml

          # check junit for failures
          if [ -f reports/junit.xml ]; then
            if grep -E "failures=\"[1-9][0-9]*\"|errors=\"[1-9][0-9]*\"" reports/junit.xml; then
              echo "Detected test failures or errors in reports/junit.xml"
              exit 1
            fi
          else
            echo "No junit.xml produced; assume pytest failed."
            exit 1
          fi

      - name: Coverage debug
        if: failure() || always()
        run: |
          python -c "import coverage, sys; print('coverage:', getattr(coverage, '__file__', 'no-file'), getattr(coverage, '__version__', 'no-version'))"


      - name: Upload test artifacts (junit, coverage)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            reports/
            .coverage*

      - name: Upload to Coveralls (best-effort)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.test-name }}
          COVERALLS_PARALLEL: true
        run: |
          set -euo pipefail
          coveralls debug || true
          coveralls --service=github || true

  coveralls:
    name: Report unit test coverage to coveralls
    needs: tests
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
      - name: Install git and coveralls
        run: |
          set -euo pipefail
          apt-get -y update && apt-get install -y git
          python3 -m pip install --no-cache-dir "coveralls==4.1.0"

      - name: Finish coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          coveralls --service=github --finish
