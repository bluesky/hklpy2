name: Pixi latest-dependencies canary

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pixi-environment: py311
          - python-version: "3.12"
            pixi-environment: py312
          - python-version: "3.13"
            pixi-environment: py313
          - python-version: "3.14"
            pixi-environment: py314
          - python-version: "3.15-dev"
            pixi-environment: py315-dev
            experimental: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          run-install: false

      - name: Update latest dependencies
        run: pixi update -e "${{ matrix.pixi-environment }}"

      - name: Install latest environment
        run: pixi install -e "${{ matrix.pixi-environment }}"

      - name: Activate latest environment
        run: pixi shell-hook -e "${{ matrix.pixi-environment }}" >> "$GITHUB_ENV"

      - name: Diagnostic
        run: |
          set -euo pipefail
          pixi list -e "${{ matrix.pixi-environment }}"
          command -v python
          python --version
          python -m coverage --version

      - name: Run tests
        run: |
          set -euo pipefail
          python -m coverage run --parallel-mode -m pytest -q .
          python -m coverage combine
          python -m coverage report --precision 3 -m
