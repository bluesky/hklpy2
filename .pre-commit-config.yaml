# hint: pre-commit run --all-files

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # exclude_types: [jupyter]
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      # - id: check-docstring-first  # let variables have docstrings
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-case-conflict
      # - id: check-json
      # - id: check-symlinks
      - id: check-executables-have-shebangs
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: insert-license (src+tests)
        files: ^src/hklpy2/(?!_version).*\.py$
        args:
          - --license-filepath=.copyright.txt
          - --comment-style=#
          - --no-extra-eol
      - id: insert-license
        name: insert-license (scripts-py)
        files: ^scripts/.*\.py$
        args:
          - --license-filepath=.copyright.txt
          - --comment-style=#
          - --no-extra-eol
      - id: insert-license
        name: insert-license (scripts-shell)
        files: ^scripts/.*\.sh$
        args:
          - --license-filepath=.copyright.txt
          - --comment-style=#
          - --no-extra-eol
  - repo: local
    hooks:
      - id: update-copyright-year
        name: Update copyright end year
        language: python
        entry: python scripts/update_copyright_year.py
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff # replaces Flake8, isort, pydocstyle, pyupgrade
        args:
          - --fix
      - id: ruff-format # replaces Black
