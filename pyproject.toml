[build-system]
requires = ["setuptools_scm[toml]>=8", "setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hklpy2"
description = "2nd generation controls for diffractometers as PseudoPositioners in the Bluesky Framework."
authors = [
  { name = "Bluesky Team" },
  { name = "Pete Jemian", email = "prjemian+hklpy2@gmail.com" },
]
maintainers = [{ name = "Pete Jemian", email = "prjemian+hklpy2@gmail.com" }]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["bluesky", "diffraction", "diffractometer"]
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license
license = "LicenseRef-UChicago-Argonne-LLC-License"
license-files = ["LICEN[CS]E*"]
# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: OpenStack",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "bluesky_tiled_plugins>=2.0.12",
  "bluesky",
  "cytoolz",
  "Deprecated",
  "numpy",
  "ophyd",
  "pandas",
  "pint",
  "pyRestTable",
  "ruamel.yaml",
  "tiled",
  "tqdm",
  "typeguard",
]

[project.entry-points."hklpy2.solver"]
no_op = "hklpy2.backends.no_op:NoOpSolver"
# HklSolver relies on the 'hkl' package.
# If that package cannot be imported, then solver states it is not available.
hkl_soleil = "hklpy2.backends.hkl_soleil:HklSolver"
th_tth = "hklpy2.backends.th_tth_q:ThTthSolver"

[project.optional-dependencies]
dev = [
  "build",
  "coverage",
  "coveralls",
  "mypy",
  "pre-commit",
  "pytest",
  "ruff",
  "bson",
  "doct",
  "humanize",
  "mongomock",
  "pymongo",
  "pytest-cov",
  "pytest-mock",
  "suitcase-mongo",
  "tiled[server]",
]
doc = [
  "apstools",
  "astroid<3.9999",  # https://stackoverflow.com/a/79414363 due to  [autoapi.not_readable]
  "ipython",
  "markupsafe",
  "matplotlib",
  "myst-nb",
  "myst-parser",
  "nbsphinx",
  "ophyd",
  "pydata-sphinx-theme",
  "setuptools >=70.1",
  "setuptools-scm >=8",
  "spec2nexus",
  "sphinx >=7",
  "sphinx-autoapi",
  "sphinx-design",
  "sphinx-tabs",
]
all = ["hklpy2[dev,doc]"]

[project.urls]
homepage = "https://blueskyproject.io/hklpy2/"
issues = "https://github.com/bluesky/hklpy2/issues"
source = "https://github.com/bluesky/hklpy2"

[tool.black]
line-length = 115 # matches the value of 'max-line-length' in .flake8
target-version = ['py312']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | examples/archive
    | build
    | dist
  )/
  | hkl/_version.py
)
'''

[tool.flake8]
max-line-length = 115
extend-ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
# Match isort's force_single_line behavior for imports
skip-magic-trailing-comma = true

[tool.coverage.report]
fail_under = 100
# Exclude lines that are genuinely untestable or unreachable in the test
# environment (e.g. abstract-method stubs, TYPE_CHECKING guards).
exclude_also = [
    "^\\s*@(abc\\.)?abstractmethod",
    "^\\s*if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.coverage.run]
# Do not measure coverage of the test files themselves; only measure
# production code under src/hklpy2 (excluding the tests/ subdirectories).
omit = [
    "*/tests/*",
    "*/tests/**",
]

[tool.pixi.dependencies]
bson = "*"
coverage = "*"
coveralls = "*"
epics-base = "*"
greenlet = "*"
hkl = "*"
pyepics = "*"
pytest = "*"
pyyaml = "*"
"ruamel.yaml" = "*"
setuptools-scm = "*"
yaml = "*"

[tool.pixi.environments]
default = { features = ["py313", "tiled-conda"], solve-group = "py313" }
py311 = { features = ["py311", "tiled-conda"], solve-group = "py311" }
py312 = { features = ["py312", "tiled-conda"], solve-group = "py312" }
py313 = { features = ["py313", "tiled-conda"], solve-group = "py313" }
py314 = { features = ["py314", "tiled-pypi"], solve-group = "py314" }
py315-dev = { features = ["py315-dev"], solve-group = "py315-dev" }

[tool.pixi.feature.tiled-conda.dependencies]
tiled = "0.2.20"

[tool.pixi.feature.tiled-pypi.pypi-dependencies]
tiled = { version = "==0.2.20", extras = ["server"] }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py315-dev.dependencies]
python = "3.15.*"

[tool.pixi.pypi-dependencies]
hklpy2 = { path = ".", editable = true, extras = ["all"] }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.55.0"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-m", "not benchmark"]
markers = [
    "benchmark: throughput benchmark tests; excluded from default runs (deselect with '-m not benchmark')",
]
# filterwarnings = [
#   # Warnings inherited from upstream packages.
#   "ignore:.*'wheel' package is no longer the canonical*:DeprecationWarning",
# ]

[tool.setuptools]
package-dir = {"hklpy2" = "src/hklpy2"}

[tool.setuptools_scm]
