[build-system]
requires = ["setuptools_scm[toml]>=8", "setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hklpy2"
description = "2nd generation controls for diffractometers as PseudoPositioners in the Bluesky Framework."
authors = [
  { name = "Bluesky Team" },
  { name = "Pete Jemian", email = "prjemian+hklpy2@gmail.com" },
]
maintainers = [{ name = "Pete Jemian", email = "prjemian+hklpy2@gmail.com" }]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["bluesky", "diffraction", "diffractometer"]
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license
license = "LicenseRef-UChicago-Argonne-LLC-License"
license-files = ["LICEN[CS]E*"]
# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: OpenStack",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "bluesky_tiled_plugins",
  "bluesky",
  "cytoolz",
  "Deprecated",
  "numpy",
  "ophyd",
  "pandas",
  "pint",
  "pyRestTable",
  "ruamel.yaml",
  "tiled",
  "tqdm",
  "typeguard",
]

[project.entry-points."hklpy2.solver"]
no_op = "hklpy2.backends.no_op:NoOpSolver"
# HklSolver relies on the 'hkl' package.
# If that package cannot be imported, then solver states it is not available.
hkl_soleil = "hklpy2.backends.hkl_soleil:HklSolver"
th_tth = "hklpy2.backends.th_tth_q:ThTthSolver"

[project.optional-dependencies]
dev = [
  "build",
  "coverage",
  "coveralls",
  "isort",
  "mypy",
  "pre-commit",
  "pytest",
  "ruff",
  "bson",
  "doct",
  "humanize",
  "mongomock",
  "pymongo",
  "pytest-cov",
  "pytest-mock",
  "suitcase-mongo",
]
doc = [
  "apstools",
  "astroid<3.9999",  # https://stackoverflow.com/a/79414363 due to  [autoapi.not_readable]
  "ipython",
  "markupsafe",
  "matplotlib",
  "myst-nb",
  "myst-parser",
  "nbsphinx",
  "ophyd",
  "pydata-sphinx-theme",
  "setuptools >=70.1",
  "setuptools-scm >=8",
  "spec2nexus",
  "sphinx >=7",
  "sphinx-autoapi",
  "sphinx-design",
  "sphinx-tabs",
]
all = ["hklpy2[dev,doc]"]

[project.urls]
homepage = "https://blueskyproject.io/hklpy2/"
issues = "https://github.com/bluesky/hklpy2/issues"
source = "https://github.com/bluesky/hklpy2"

[tool.black]
line-length = 115 # matches the value of 'max-line-length' in .flake8
target-version = ['py312']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | examples/archive
    | build
    | dist
  )/
  | hkl/_version.py
)
'''

[tool.flake8]
max-line-length = 115
extend-ignore = ["E501"]

[tool.isort]
profile = "black"
force_single_line = true
line_length = 115
src_paths = ["."]

[tool.coverage.run]
# Do not measure coverage of the test files themselves; only measure
# production code under src/hklpy2 (excluding the tests/ subdirectories).
omit = [
    "*/tests/*",
    "*/tests/**",
]

[tool.coverage.report]
fail_under = 100
# Exclude lines that are genuinely untestable or unreachable in the test
# environment (e.g. abstract-method stubs, TYPE_CHECKING guards).
exclude_also = [
    "^\\s*@(abc\\.)?abstractmethod",
    "^\\s*if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
line-length = 115  # matches .flake8 and [tool.black]
target-version = "py310"  # project's minimum Python version

[tool.ruff.lint]
# Rules that are enabled by default in ruff but conflict with this project's style
# Suppress these to allow pre-existing code patterns
ignore = [
    # Code style - these are preferences, not correctness issues
    "C408",     # unnecessary-collection-call (prefer dict() over {})
    "SIM905",   # split-static-string (prefer str.split() over list literals)
    # Type annotations - we use Union/Optional for clarity in some contexts
    "UP045",    # non-pep604-annotation-optional (Optional[X] vs X | None)
    "UP007",    # non-pep604-annotation-union (Union[X, Y] vs X | Y)
    "UP006",    # non-pep585-annotation (List[X] vs list[X], Dict vs dict)
    # Import sorting - pre-commit handles this, ruff rules can conflict
    "I001",     # unsorted-imports (isort integration; pre-commit/isort manages)
    # Minor style issues that don't affect correctness
    "PLR2044",  # empty-comment (comments with just # characters)
    "SIM118",   # in-dict-keys (key in dict vs key in dict.keys())
    "SIM210",   # if-expr-with-true-false (conditional expressions)
    "RUF100",   # unused-noqa (some noqa's are for specific ruff versions)
    "UP035",    # deprecated-import (typing imports handled differently)
    "SIM102",   # collapsible-if (readability preference)
    # Docstring style - we don't enforce PEP 257 strictly in this project
    "D100",     # Missing module docstring
    "D102",     # Missing docstring in public method
    "D104",     # Missing docstring in public package
    "D105",     # Missing docstring in magic method
    "D106",     # Missing docstring in public nested class
    "D107",     # Missing docstring in __init__
    "D200",     # One-line docstring should fit on one line
    "D205",     # 1 blank line required between summary and description
    "D209",     # Multi-line docstring closing quotes should be on a separate line
    "D212",     # Multi-line docstring summary should start at the first line
    "D213",     # Multi-line docstring summary should start at the second line
    "D400",     # First line should end with a period
    "D401",     # First line should be in imperative mood
    "D405",     # Section name should be properly capitalized
    "D407",     # Missing dashed underline after section
    "D412",     # Blank line required before section
    "D413",     # Missing blank line after last section
    "D415",     # First line should end with a period, question mark, or exclamation point
    "D417",     # Missing argument description in docstring
    # Exception handling - we allow vanilla exception raising
    "TRY003",   # Avoid specifying long messages outside the exception class
    # Other - legacy code patterns we allow
    "N802",     # function-name-should-be-lowercase (some functions use different naming)
    "N806",     # non-lowercase-variable-in-function (convention preference)
    "B905",     # zip-without-explicit-strict (older code may not use strict)
    "E501",     # line-too-long (we use line-length = 115)
]

# Extend select to ensure important rules are checked
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "N",        # pep8-naming
    "D",        # pydocstyle
    "I",        # isort (import sorting)
    "S",        # bandit (security)
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "RUF",      # ruff-specific rules
    "TRY",      # tryceratops (exception handling)
    "SIM",      # flake8-simplify (some)
    "UP",       # pyupgrade (some)
]

[tool.ruff.lint.per-file-ignores]
# Test files can use more permissive rules
"**/tests/*" = [
    "D100",     # Missing module docstring
    "D103",     # Missing function docstring
]
# Documentation examples are not part of the main codebase
"docs/**/*.py" = ["ALL"]
"docs/**/*.ipynb" = ["ALL"]
# Auto-generated or vendored code
"*/_version.py" = ["ALL"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-m", "not benchmark"]
markers = [
    "benchmark: throughput benchmark tests; excluded from default runs (deselect with '-m not benchmark')",
]
# filterwarnings = [
#   # Warnings inherited from upstream packages.
#   "ignore:.*'wheel' package is no longer the canonical*:DeprecationWarning",
# ]

[tool.setuptools]
package-dir = {"hklpy2" = "src/hklpy2"}

[tool.setuptools_scm]
